name: tests
on: [push]
jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps
      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm type:check
      - run: pnpm test:coverage
      - run: pnpm build
      # The command line client compiles to one executable; check it still does.
      - run: pnpm build:cli
      - run: ./dist/filepizza --version
      - run: pnpm test:e2e
