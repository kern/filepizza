name: tests
on: [push]
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm build
      - run: pnpm exec playwright test --project=webkit diagnose.test.ts
